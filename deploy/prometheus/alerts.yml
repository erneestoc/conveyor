# Prometheus alerting rules for Conveyor (scrape /metrics; see docs/operations.md).
# Load with `rule_files: [alerts.yml]` or as a PrometheusRule (the Helm chart renders one
# when `prometheusRule.enabled` is set).
groups:
  - name: conveyor
    rules:
      - alert: ConveyorAckLatencyHigh
        expr: histogram_quantile(0.99, sum by (le) (rate(conveyor_ingest_ack_latency_us_bucket[5m]))) > 250000
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "BES ack latency p99 above 250 ms"
          description: "Bazel waits for acks at the end of every build; check writer flush time and PostgreSQL."

      - alert: ConveyorWriterFlushSlow
        expr: histogram_quantile(0.99, sum by (le) (rate(conveyor_ingest_writer_flush_duration_bucket[5m]))) > 500
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Group commit p99 above 500 ms"
          description: "PostgreSQL is slow or contended (CPU, dead tuples on invocations, pool)."

      - alert: ConveyorDbPoolQueueing
        expr: histogram_quantile(0.99, sum by (le) (rate(conveyor_repo_query_queue_time_bucket[5m]))) > 50
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Waiting more than 50 ms for a database connection"
          description: "Raise POOL_SIZE or PostgreSQL capacity."

      - alert: ConveyorFencedCommits
        expr: increase(conveyor_ingest_fenced_count[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "Fenced batch commits"
          description: "Two nodes wrote the same invocation; a stream was retried onto another node mid-build. Harmless once, a balancer or lifecycle problem when it repeats."

      - alert: ConveyorJobBacklog
        expr: conveyor_oban_oldest_available_seconds > 600
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Oban jobs waiting for more than 10 minutes in {{ $labels.queue }}"
          description: "The queue is not draining: producers down, jobs with attempt = max_attempts (rescue with Oban.retry_all_jobs, never by editing state), or parses slower than the job timeout."

      - alert: ConveyorRawArchiveBehind
        expr: max(conveyor_raw_archive_overdue_seconds) > 21600
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Raw archive more than 6 hours behind"
          description: "Finished builds are not moving to the blob store (store outage, credentials, failing jobs: see conveyor_raw_archive_failures_count and the archive queue). Nothing is lost: the partition drop keeps those days, so Postgres grows until the archive catches up."

      - alert: ConveyorRawArchiveMismatch
        expr: increase(conveyor_raw_archive_failures_count{reason="mismatch"}[1h]) > 0
        labels: {severity: warning}
        annotations:
          summary: "A build's raw segments did not match its row"
          description: "The raw archive skipped it (raw_status = skipped); its events stay in the segments until RETENTION_RAW_DAYS. Run Conveyor.Ingest.Verify.check on the invocation from the log line."

      - alert: ConveyorBlobErrors
        expr: increase(conveyor_blobs_errors_count[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "Blob store errors"
          description: "Reads or writes against the disk or S3 store failed; check credentials, bucket policy and disk space."

      - alert: ConveyorCommitPressure
        expr: max by (instance) (conveyor_ingest_writer_backlog_oldest_ms) > 5000
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "The oldest uncommitted batch on {{ $labels.instance }} is older than 5 s"
          description: "Commits are not keeping up (batches expire at INGEST_WRITER_DEADLINE_MS, 20 s). The node sheds new builds from here on; see the Overload runbook in docs/operations.md."

      - alert: ConveyorShedding
        expr: conveyor_admission_state_level >= 2
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }} is refusing new builds"
          description: "Admission level {{ $value }} (2 shedding, 3 critical): commit pressure is above a quarter of the writer deadline. Builds in progress continue; new ones get UNAVAILABLE and retry. One node: look at that node (a hot shard, a lock wait). Every node: the database or its volume is the bottleneck."

      - alert: ConveyorCritical
        expr: conveyor_admission_state_level >= 3
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.instance }} is refusing every new stream"
          description: "Commit pressure is above three quarters of the writer deadline; the events of open streams are refused next (conveyor_admission_refused_count{door=\"event\"}). Add database capacity or lower the load; do not restart nodes, their streams would resend elsewhere."

      - alert: ConveyorEventsRefused
        expr: increase(conveyor_admission_refused_count{door="event"}[5m]) > 0
        labels: {severity: critical}
        annotations:
          summary: "Open streams are being failed to shed load"
          description: "The last resort before batches expire: events of open streams were refused so their clients resend instead of waiting for an acknowledgement that would come too late. Builds are losing their upload; capacity is short now."

      - alert: ConveyorBatchesExpired
        expr: increase(conveyor_ingest_writer_expired_count[5m]) > 0
        labels: {severity: critical}
        annotations:
          summary: "Batches passed the commit deadline"
          description: "Admission did not shed early enough, or it is off (ADMISSION=off): batches waited INGEST_WRITER_DEADLINE_MS and their streams failed. Check conveyor_admission_state_level over the same window."

      - alert: ConveyorKeyAboveShare
        expr: increase(conveyor_admission_refused_count{reason="key_share"}[10m]) > 0
        labels: {severity: info}
        annotations:
          summary: "New builds of an API key were refused under pressure"
          description: "A node at the elevated level refused new builds of a key holding more than its share of the node's streams. If it repeats, find the key (stream counts per key are in the node, not in the metrics) and lower its MAX_STREAMS_PER_KEY override or add capacity."

      - alert: ConveyorNotReadyForLong
        expr: conveyor_admission_state_ready == 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }} has reported not ready for 10 minutes"
          description: "Draining that does not finish, a database only this node cannot reach, or a node that is overloaded while most of its peers are not. The balancer sends it no new connections meanwhile."

      - alert: ConveyorNodeNotReady
        expr: up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "A Conveyor node stopped answering scrapes"
