apiVersion: v1
kind: Service
metadata:
  name: conveyor
  namespace: conveyor
spec:
  selector: { app: conveyor }
  ports:
    - { name: http, port: 4000, targetPort: http }
    - { name: grpc, port: 1985, targetPort: grpc }
---
# Headless service used by libcluster (Kubernetes.DNS strategy) to find peer pods.
apiVersion: v1
kind: Service
metadata:
  name: conveyor-headless
  namespace: conveyor
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: conveyor }
  ports:
    - { name: epmd, port: 4369, targetPort: 4369 }
    - { name: dist, port: 9100, targetPort: 9100 }
