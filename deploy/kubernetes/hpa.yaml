apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: conveyor
  namespace: conveyor
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: conveyor }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleDown:
      # Scale-in drains: give streams time to finish before the next pod goes.
      stabilizationWindowSeconds: 300
      policies: [{ type: Pods, value: 1, periodSeconds: 120 }]
