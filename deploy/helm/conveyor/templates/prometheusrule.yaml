{{- if .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "conveyor.fullname" . }}
  labels: {{- include "conveyor.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- /* files/alerts.yml is a copy of deploy/prometheus/alerts.yml */}}
  {{- (.Files.Get "files/alerts.yml") | fromYaml | toYaml | nindent 2 }}
{{- end }}
