{{- if .Values.ingress.web.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "conveyor.fullname" . }}-web
  labels: {{- include "conveyor.labels" . | nindent 4 }}
  {{- with .Values.ingress.web.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.web.tls }}
  tls: [{ hosts: [{{ .Values.hosts.web | quote }}], secretName: {{ include "conveyor.fullname" . }}-web-tls }]
  {{- end }}
  rules:
    - host: {{ .Values.hosts.web | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "conveyor.fullname" . }}, port: { name: http } } }
{{- end }}
{{- if .Values.ingress.grpc.enabled }}
---
# gRPC (HTTP/2) for Bazel; the annotations are for ingress-nginx.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "conveyor.fullname" . }}-grpc
  labels: {{- include "conveyor.labels" . | nindent 4 }}
  {{- with .Values.ingress.grpc.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.grpc.tls }}
  tls: [{ hosts: [{{ .Values.hosts.grpc | quote }}], secretName: {{ include "conveyor.fullname" . }}-grpc-tls }]
  {{- end }}
  rules:
    - host: {{ .Values.hosts.grpc | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "conveyor.fullname" . }}, port: { name: grpc } } }
{{- end }}
