apiVersion: v2
name: conveyor
description: Self-hosted Bazel Build Event Service server with a real-time UI, dashboards and execution-log insights
type: application
version: 0.2.1
appVersion: "0.2.1"
kubeVersion: ">=1.25.0"
home: https://erneestoc.github.io/conveyor/
sources: [https://github.com/erneestoc/conveyor]
keywords: [bazel, build-event-service, bes, build, ci, observability, remote-cache]
maintainers:
  - name: Ernesto Cambuston
    url: https://github.com/erneestoc
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: integration-delivery
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: Documentation
      url: https://erneestoc.github.io/conveyor/
    - name: Install guide
      url: https://erneestoc.github.io/conveyor/install/
    - name: Source
      url: https://github.com/erneestoc/conveyor
  artifacthub.io/changes: |
    - kind: fixed
      description: A resend of an absorbed, uncommitted event is acknowledged by its commit, not on sight (found by the TLA+ model of the ingest protocol)
    - kind: changed
      description: Dashboard panels load once per view; spawn reports read the hourly rollups
    - kind: added
      description: Hourly dashboard rollups (invocation_rollups, kept by a job every five minutes; a dashboard load with 100k builds went from 2.2 s to 0.5 s)
    - kind: changed
      description: Ingest uses about 40 % less CPU per event and 27 % less memory per stream; event segments are compressed with a BEP zstd dictionary (−38 %)
    - kind: added
      description: INGEST_WRITER_MAX_PENDING bounds the batches a writer shard commits early
    - kind: added
      description: ServiceAccount with annotations (IRSA), extraVolumes and extraVolumeMounts (database CA bundle)
    - kind: added
      description: Optional PrometheusRule with the alert rules
    - kind: changed
      description: Chart README documents every value, OIDC, S3 credentials, database TLS and upgrades
