name: Release

# On a version tag: build the multi-arch image, push it to GHCR, package the Helm chart
# and push it as an OCI artifact, and create the GitHub release from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Push chart to GHCR (OCI)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm package deploy/helm/conveyor --version "$VERSION" --app-version "$VERSION" \
            --set image.repository=ghcr.io/${{ github.repository }}
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push conveyor-"$VERSION".tgz oci://ghcr.io/$OWNER/charts
      - uses: oras-project/setup-oras@v1
      - name: Push Artifact Hub repository metadata
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
          oras push ghcr.io/$OWNER/charts/conveyor:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            deploy/helm/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  release:
    runs-on: ubuntu-latest
    needs: [image, chart]
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk -v v="$VERSION" '/^## /{p = index($0, v) > 0} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "Conveyor $VERSION" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
