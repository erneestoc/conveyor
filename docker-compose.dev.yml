# Development dependencies only. The production compose file is docker-compose.yml (M8).
services:
  postgres:
    image: postgres:17-alpine
    container_name: conveyor-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conveyor_dev
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - conveyor-pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  conveyor-pgdata:
